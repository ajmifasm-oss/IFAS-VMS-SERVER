name: Build IFAS VMS Client

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-client:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore IFAS-VMS.sln

      - name: Build Client
        run: >
          dotnet publish
          03-IFAS-VMS-CLIENT/IFAS.VMS.Client.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/client

      - name: Create Client ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path publish/client/* `
            -DestinationPath IFAS-VMS-Client-win-x64.zip `
            -Force

      - name: Upload Client Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IFAS-VMS-Client-win-x64
          path: IFAS-VMS-Client-win-x64.zip
