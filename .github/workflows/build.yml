name: Unzip, Fix EF Core and Build EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Extract ZIP File
      shell: powershell
      run: |
        Expand-Archive -Path "*.zip" -DestinationPath "./extracted" -Force

    - name: Add Global Usings
      shell: powershell
      run: |
        $targets = @"
        <Project>
          <ItemGroup>
            <Using Include="Microsoft.EntityFrameworkCore" />
          </ItemGroup>
        </Project>
        "@
        $targets | Out-File -FilePath "./extracted/Directory.Build.targets" -Encoding utf8

    - name: Restore Dependencies
      run: |
        $csproj = Get-ChildItem -Path "./extracted" -Filter "*.csproj" -Recurse | Select-Object -First 1
        dotnet restore $csproj.FullName

    - name: Build Project
      run: |
        $csproj = Get-ChildItem -Path "./extracted" -Filter "*.csproj" -Recurse | Select-Object -First 1
        dotnet build $csproj.FullName --configuration Release
