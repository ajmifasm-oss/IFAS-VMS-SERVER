name: Unzip and Build .NET EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Unzip project automatically
      run: |
        $zipFile = Get-ChildItem -Filter "*.zip" | Select-Object -First 1
        if ($zipFile) {
            Expand-Archive -Path $zipFile.FullName -DestinationPath ./extracted
        } else {
            Write-Error "No ZIP file found!"
        }

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build EXE
      run: |
        $csproj = Get-ChildItem -Path ./extracted -Recurse -Filter "IFAS.Server.csproj" | Select-Object -First 1
        if ($csproj) {
            dotnet publish $csproj.FullName -c Release -r win-x64 --self-contained -o ./output
        } else {
            Write-Error "IFAS.Server.csproj file not found inside ZIP!"
        }

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: IFAS-Server-EXE
        path: ./output
