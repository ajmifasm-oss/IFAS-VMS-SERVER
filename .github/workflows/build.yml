name: Unzip, Fix EF Core and Build EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Extract ZIP File
      shell: powershell
      run: |
        Expand-Archive -Path "*.zip" -DestinationPath "./extracted" -Force

    - name: Fix Missing Namespace in LicenseService.cs
      shell: powershell
      run: |
        $file = Get-ChildItem -Path "./extracted" -Filter "LicenseService.cs" -Recurse | Select-Object -First 1
        if ($file) {
            $path =$file.FullName
            $content = Get-Content -Path$path -Raw
            if ($content -notmatch "using Microsoft.EntityFrameworkCore;") {
                $newContent = "using Microsoft.EntityFrameworkCore;`r`n" + $content
                Set-Content -Path $path -Value$newContent
                Write-Host "Added missing EntityFrameworkCore namespace successfully."
            }
        } else {
            Write-Error "LicenseService.cs file not found!"
        }

    - name: Restore Dependencies
      run: |
        $csproj = Get-ChildItem -Path "./extracted" -Filter "*.csproj" -Recurse | Select-Object -First 1
        dotnet restore $csproj.FullName

    - name: Build Project
      run: |
        $csproj = Get-ChildItem -Path "./extracted" -Filter "*.csproj" -Recurse | Select-Object -First 1
        dotnet build $csproj.FullName --configuration Release
