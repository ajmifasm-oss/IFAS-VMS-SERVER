name: Unzip, Fix EF Core and Build EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Extract ZIP File
      shell: powershell
      run: |
        Expand-Archive -Path "*.zip" -DestinationPath "./extracted" -Force

    - name: Fix Missing Namespace in LicenseService.cs
      shell: powershell
      run: |
        Get-ChildItem -Path "./extracted" -Filter "LicenseService.cs" -Recurse | ForEach-Object { (Get-Content $_.FullName) -replace 'using System;', 'using System;`r`nusing Microsoft.EntityFrameworkCore;' | Set-Content $_.FullName }

    - name: Restore Dependencies
      run: |
        $csproj = Get-ChildItem -Path "./extracted" -Filter "*.csproj" -Recurse | Select-Object -First 1
        dotnet restore $csproj.FullName

    - name: Build Project
      run: |
        $csproj = Get-ChildItem -Path "./extracted" -Filter "*.csproj" -Recurse | Select-Object -First 1
        dotnet build $csproj.FullName --configuration Release
